
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100923">
<title>L'ATOME — Le Cirque de la Science</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100923;color:white;font-family:Arial,sans-serif;overflow:hidden}
#stage{height:100dvh;min-height:520px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#60428c,#21133c 55%,#080617)}
#stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 8%,#ffffff08 8.2% 8.5%);pointer-events:none}
#lights{position:absolute;inset:-50%;background:conic-gradient(from 0deg at 50% 30%,transparent,#ff9bd022,transparent,#6ceaff22,transparent);animation:lights 18s linear infinite}
@keyframes lights{to{transform:rotate(360deg)}}
#stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:3px;height:3px;background:white;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
#curtainL,#curtainR{position:absolute;z-index:8;top:0;height:100%;width:51%;background:repeating-linear-gradient(90deg,#570a2c 0 17px,#a51d4b 18px 37px,#6d1038 38px 55px);transition:transform 2s cubic-bezier(.7,0,.2,1);pointer-events:none}
#curtainL{left:0;transform:translateX(-110%)}
#curtainR{right:0;transform:translateX(110%)}
#curtainL.closed{transform:translateX(0)}
#curtainR.closed{transform:translateX(0)}
#curtainL.open,#curtainR.open{transform:translateX(0)}
#curtainL.open{transform:translateX(-110%)}
#curtainR.open{transform:translateX(110%)}
#world{position:absolute;inset:0;transition:filter .4s,transform 1.5s}
#stageName{position:absolute;top:18px;width:100%;text-align:center;letter-spacing:5px;color:#f0d9ff;font-size:11px;z-index:2}
#floor{position:absolute;bottom:-25%;left:-20%;width:140%;height:55%;background-color:#171027;background-image:linear-gradient(#7454a7 1px,transparent 1px),linear-gradient(90deg,#7454a7 1px,transparent 1px);background-size:55px 40px;transform:perspective(250px) rotateX(55deg);opacity:.6}
#spotlight{position:absolute;top:-20%;left:50%;width:70%;height:95%;transform:translateX(-50%);background:linear-gradient(180deg,#ffffff30,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.5}
#title{position:absolute;z-index:3;top:25%;width:100%;text-align:center;opacity:0;transform:scale(.5);transition:1s}
#title.show{opacity:1;transform:scale(1)}
#title h1{font-size:clamp(50px,13vw,105px);letter-spacing:8px;margin:0;color:#fff;text-shadow:0 0 12px #7edfff,0 0 40px #a16bff}
#title p{letter-spacing:5px;color:#e9d9ff}
#actors{position:absolute;inset:0;z-index:4;pointer-events:none}
.actor{position:absolute;bottom:16%;width:clamp(130px,25vw,250px);height:clamp(230px,48vw,400px);opacity:0;transform:translateY(80px) scale(.85);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 15px 18px #0008)}
.actor.show{opacity:1;transform:translateY(0) scale(1)}
.actor.left{left:4%}
.actor.right{right:4%}
.actor.center{left:50%;transform:translate(-50%,80px) scale(.85)}
.actor.center.show{transform:translate(-50%,0) scale(1)}
.actor.talk .mouth{animation:talk .17s infinite alternate}
@keyframes talk{to{transform:scaleY(2.2)}}
.actor.bounce{animation:bounce .6s ease-in-out 2}
@keyframes bounce{50%{transform:translateY(-25px) rotate(4deg)}}
.actor.center.bounce{animation:bounceCenter .6s ease-in-out 2}
@keyframes bounceCenter{50%{transform:translate(-50%,-25px) rotate(4deg)}}
svg{width:100%;height:100%;overflow:visible}
#bubble{width:clamp(100px,18vw,180px);height:clamp(130px,26vw,240px);bottom:25%}
#bubble .bubblefloat{animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-15px) rotate(5deg)}}
#dialogue{position:absolute;z-index:10;bottom:5%;left:50%;transform:translateX(-50%);width:min(760px,92%);padding:15px 18px;border:1px solid #c5a0ff;border-radius:17px;background:#100b24ed;box-shadow:0 0 30px #a77aff35;opacity:0;transition:opacity .3s;text-align:center;min-height:90px}
#dialogue.show{opacity:1}
#speaker{color:#aeeaff;font-size:12px;font-weight:bold;letter-spacing:4px;margin-bottom:9px}
#words{font-size:clamp(15px,3.5vw,21px);line-height:1.5}
#explanation{position:absolute;z-index:6;top:12%;left:50%;transform:translateX(-50%);width:min(390px,76%);padding:12px 15px;background:#0b183be8;border:1px solid #68cfff;border-radius:14px;text-align:center;opacity:0;transition:opacity .5s;box-shadow:0 0 25px #48aaff33}
#explanation.show{opacity:1}
#explanation h2{font-size:clamp(19px,4vw,27px);color:#8de0ff;margin:4px}
#explanation p{font-size:clamp(12px,2.8vw,15px);line-height:1.5;color:#e1e9ff;margin:7px}
.atomart{width:120px;height:120px;margin:auto;display:block}
#controls{position:absolute;z-index:20;top:15px;right:12px;display:flex;gap:6px}
button{background:#24163e;color:white;border:1px solid #b69aff;border-radius:22px;padding:9px 13px;font-weight:bold;font-size:12px}
button:active{background:#754ca9}
#play{position:absolute;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);padding:17px 27px;font-size:16px;background:#3c2467;box-shadow:0 0 35px #a87cff80}
#glitch{position:absolute;z-index:15;inset:0;opacity:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ff00aa33 0 2px,transparent 2px 6px)}
#glitch.on{opacity:1;animation:glitch .13s infinite}
@keyframes glitch{0%{transform:translateX(-5px);filter:hue-rotate(90deg)}50%{transform:translateX(5px);filter:invert(.4)}100%{transform:translateX(0)}}
#blackout{position:absolute;z-index:16;inset:0;background:black;opacity:0;pointer-events:none;transition:opacity .5s}
#blackout.on{opacity:1}
#progress{position:absolute;bottom:0;left:0;width:100%;height:3px;background:#ffffff25;z-index:21}
#bar{height:100%;width:0;background:#b8eaff}
@media(max-width:600px){
 .actor{bottom:25%;height:235px;width:125px}
 .actor.left{left:0}.actor.right{right:0}
 #bubble{height:140px;width:105px}
 #dialogue{bottom:9%;padding:11px}
 #explanation{top:12%}
 #controls button{padding:8px 10px}
}
</style>
</head>
<body>
<div id="stage">
 <div id="lights"></div>
 <div id="stars"></div>
 <div id="world">
  <div id="stageName">LE CIRQUE DE LA SCIENCE</div>
  <div id="spotlight"></div>
  <div id="floor"></div>

  <div id="title">
   <h1>L'ATOME</h1>
   <p>AU CŒUR DE LA MATIÈRE</p>
  </div>

  <div id="actors">

   <!-- JAX : lapin violet -->
   <div class="actor left" id="jax">
    <svg viewBox="0 0 220 360">
     <path d="M65 110 Q20 10 57 8 Q91 5 92 105" fill="#9b55c4" stroke="#432052" stroke-width="6"/>
     <path d="M130 105 Q140 0 175 12 Q202 30 157 120" fill="#9b55c4" stroke="#432052" stroke-width="6"/>
     <path d="M65 75 Q58 25 65 27" stroke="#dcaaff" stroke-width="6" fill="none"/>
     <path d="M145 82 Q165 25 174 34" stroke="#dcaaff" stroke-width="6" fill="none"/>
     <path d="M55 115 Q110 80 165 115 Q190 160 165 205 Q110 242 55 205 Q30 160 55 115" fill="#b9a1cc" stroke="#3c204d" stroke-width="6"/>
     <ellipse cx="82" cy="158" rx="15" ry="20" fill="#fff"/>
     <ellipse cx="139" cy="158" rx="15" ry="20" fill="#fff"/>
     <ellipse cx="88" cy="161" rx="6" ry="10" fill="#e9c73d"/>
     <ellipse cx="133" cy="161" rx="6" ry="10" fill="#e9c73d"/>
     <path d="M90 190 Q111 211 146 187" fill="none" stroke="#48223e" stroke-width="7" stroke-linecap="round"/>
     <path d="M72 220 Q110 208 150 220 L172 335 Q110 360 48 335Z" fill="#9a3ab5" stroke="#49205d" stroke-width="6"/>
     <path d="M75 245 L35 300 M150 245 L190 290" stroke="#b9a1cc" stroke-width="19" stroke-linecap="round"/>
     <path d="M70 330 L60 350 M150 330 L160 350" stroke="#b9a1cc" stroke-width="20" stroke-linecap="round"/>
    </svg>
   </div>

   <!-- BUBBLE -->
   <div class="actor right" id="bubble">
    <svg viewBox="0 0 180 220" class="bubblefloat">
     <defs><radialGradient id="bg"><stop stop-color="#e9ffff"/><stop offset=".55" stop-color="#79e5ff"/><stop offset="1" stop-color="#2386d2"/></radialGradient></defs>
     <circle cx="90" cy="100" r="72" fill="url(#bg)" stroke="#d9ffff" stroke-width="5"/>
     <ellipse cx="66" cy="90" rx="12" ry="19" fill="white"/>
     <ellipse cx="111" cy="90" rx="12" ry="19" fill="white"/>
     <circle cx="70" cy="94" r="6" fill="#183d68"/>
     <circle cx="108" cy="94" r="6" fill="#183d68"/>
     <path class="mouth" d="M70 128 Q92 153 118 126" fill="none" stroke="#17517a" stroke-width="7" stroke-linecap="round"/>
     <path d="M40 50 Q58 22 75 30" fill="none" stroke="white" stroke-width="9" opacity=".6"/>
    </svg>
   </div>

   <!-- CAINE : tête de dents -->
   <div class="actor center" id="caine">
    <svg viewBox="0 0 220 360">
     <path d="M36 115 Q20 65 63 60 Q95 30 110 70 Q135 30 165 60 Q205 65 184 120 L165 210 Q110 245 55 210Z" fill="#f5e5d5" stroke="#7e263b" stroke-width="7"/>
     <path d="M43 112 Q110 80 178 112 L164 175 Q110 205 56 175Z" fill="#9f253e"/>
     <path d="M48 115 L74 145 L96 115 L119 148 L143 114 L168 143" fill="#fff5e9" stroke="#a44a56" stroke-width="3"/>
     <ellipse cx="82" cy="86" rx="19" ry="21" fill="#fff"/>
     <ellipse cx="140" cy="86" rx="19" ry="21" fill="#fff"/>
     <circle cx="86" cy="88" r="8" fill="#1c203a"/>
     <circle cx="136" cy="88" r="8" fill="#1c203a"/>
     <path d="M65 55 Q110 20 155 55" stroke="#ffcc64" stroke-width="8" fill="none"/>
     <path d="M60 220 L160 220 L183 335 L38 335Z" fill="#b62c4d" stroke="#641c3a" stroke-width="6"/>
     <path d="M62 250 L20 310 M158 250 L200 310" stroke="#f2e3d7" stroke-width="19" stroke-linecap="round"/>
     <path d="M72 332 L66 352 M148 332 L154 352" stroke="#f2e3d7" stroke-width="20" stroke-linecap="round"/>
    </svg>
   </div>

   <!-- POMNI : مهرجة -->
   <div class="actor center" id="pomni">
    <svg viewBox="0 0 220 360">
     <path d="M45 95 L15 25 Q55 22 85 75 L110 20 L135 75 Q175 22 205 25 L175 110Z" fill="#e54c72" stroke="#552244" stroke-width="6"/>
     <path d="M45 95 L15 25 L78 80Z" fill="#3179d5"/>
     <path d="M175 95 L205 25 L142 80Z" fill="#3179d5"/>
     <circle cx="15" cy="25" r="12" fill="#ffdf73"/>
     <circle cx="205" cy="25" r="12" fill="#ffdf73"/>
     <path d="M48 105 Q110 65 172 105 Q193 170 165 215 Q110 250 55 215 Q27 170 48 105" fill="#f4d5c6" stroke="#5a3047" stroke-width="6"/>
     <ellipse cx="80" cy="158" rx="17" ry="23" fill="white"/>
     <ellipse cx="140" cy="158" rx="17" ry="23" fill="white"/>
     <circle cx="84" cy="161" r="8" fill="#2874bb"/>
     <circle cx="136" cy="161" r="8" fill="#2874bb"/>
     <path d="M94 198 Q110 187 127 198" fill="none" stroke="#854c61" stroke-width="5"/>
     <path d="M55 226 L165 226 L180 340 L40 340Z" fill="#d94d72" stroke="#632443" stroke-width="6"/>
     <path d="M55 240 L110 280 L165 240" fill="none" stroke="#e9d9ff" stroke-width="15"/>
     <path d="M65 335 L55 355 M155 335 L165 355" stroke="#f3d8ca" stroke-width="19" stroke-linecap="round"/>
    </svg>
   </div>
  </div>
 </div>

 <div id="curtainL"></div><div id="curtainR"></div>

 <div id="explanation">
  <h2 id="exTitle"></h2>
  <svg class="atomart" id="atomArt" viewBox="0 0 180 180"></svg>
  <p id="exText"></p>
 </div>

 <div id="dialogue">
  <div id="speaker"></div>
  <div id="words"></div>
 </div>

 <div id="blackout"></div>
 <div id="glitch"></div>

 <button id="play" onclick="start()">▶ REGARDER L'ÉPISODE</button>

 <div id="controls">
  <button onclick="previous()">◀</button>
  <button onclick="pause()" id="pauseBtn">Ⅱ</button>
  <button onclick="next()">▶</button>
  <button onclick="voiceToggle()" id="voiceBtn">🔊</button>
 </div>
 <div id="progress"><div id="bar"></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
let scene=0,playing=false,paused=false,voice=true,timer=null,runId=0;
let voiceChoice={JAX:{pitch:1.05,rate:1.12},BUBBLE:{pitch:1.45,rate:1.02},CAINE:{pitch:.82,rate:.92},POMNI:{pitch:1.2,rate:.95},NARRATEUR:{pitch:.9,rate:.9}};

const data=[
{duration:5000,act:()=>{say("NARRATEUR","Bienvenue dans un monde où tout peut arriver...");}},
{duration:5000,act:()=>{say("NARRATEUR","Au milieu de l'espace, une aventure extraordinaire nous attend !");$("world").style.transform="scale(1.15)";}},
{duration:5000,act:()=>{show("jax");say("JAX","Salut, les spectateurs ! Vous êtes prêts pour un spectacle absolument... scientifique ?");}},
{duration:5000,act:()=>{hideAll();$("curtainL").classList.add("closed");$("curtainR").classList.add("closed");say("NARRATEUR","Mesdames et messieurs... préparez-vous !");}},
{duration:5000,act:()=>{$("curtainL").classList.add("open");$("curtainR").classList.add("open");$("title").classList.add("show");say("NARRATEUR","L'ATOME ! Au cœur de la matière !");}},
{duration:5500,act:()=>{$("title").classList.remove("show");show("jax");show("bubble");say("BUBBLE","Jax ! On peut commencer par Schrödinger ? J'adore Schrödinger !");}},
{duration:3500,act:()=>{hide("bubble");say("JAX","Pop ! Pas de raccourci, Bubble ! On commence par les bases !");}},
{duration:8000,act:()=>{show("jax");explain("DALTON","L'atome est représenté comme une sphère solide et indivisible.","solid");say("JAX","Dalton imaginait l'atome comme une petite boule solide. Simple, non ?");}},
{duration:8500,act:()=>{explain("THOMSON","Des électrons négatifs sont répartis dans une matière chargée positivement.","thomson");say("JAX","Mais Thomson a découvert l'électron ! Son modèle contient des charges négatives dans une matière positive.");}},
{duration:5000,act:()=>{hide("jax");hide("bubble");hide("explanation");show("caine");say("CAINE","Magnifique ! Jax, merci pour ce petit exposé. Maintenant, DEHORS !");}},
{duration:8500,act:()=>{explain("RUTHERFORD","Un petit noyau positif au centre. L'atome est essentiellement constitué de vide.","rutherford");say("CAINE","Rutherford découvre un noyau minuscule et positif ! Et autour ? Presque tout est vide !");}},
{duration:8500,act:()=>{explain("BOHR","Les électrons occupent des niveaux d'énergie bien définis.","bohr");say("CAINE","Bohr ajoute des niveaux d'énergie précis. Les électrons ne peuvent pas avoir n'importe quelle énergie !");}},
{duration:5000,act:()=>{hide("explanation");show("bubble");say("BUBBLE","Caine ! Caine ! Et Schrödinger ?! On a oublié Schrödinger !");}},
{duration:4000,act:()=>{hide("bubble");say("CAINE","BUBBLE ! DEHORS !");}},
{duration:2500,act:()=>{$("glitch").classList.add("on");$("world").style.filter="hue-rotate(90deg)";say("NARRATEUR","ERREUR... ERREUR...");}},
{duration:2500,act:()=>{$("blackout").classList.add("on");}},
{duration:5500,act:()=>{$("blackout").classList.remove("on");$("glitch").classList.remove("on");$("world").style.filter="none";hide("caine");show("pomni");say("POMNI","Bonjour... Est-ce que quelqu'un peut m'expliquer ce qui vient de se passer ?");}},
{duration:4500,act:()=>{show("jax");say("JAX","On allait justement parler de Schrödinger. Tu peux t'en occuper ?");}},
{duration:9500,act:()=>{hide("jax");explain("SCHRÖDINGER","La fonction d'onde décrit l'état quantique. Les orbitales indiquent les régions où la présence de l'électron est probable.","quantum");say("POMNI","Le modèle quantique ne décrit pas une trajectoire précise. Il utilise une fonction d'onde pour calculer les probabilités de présence de l'électron.");}},
{duration:6000,act:()=>{hideAll();hide("explanation");$("title").classList.add("show");say("NARRATEUR","Et voilà ! De Dalton à Schrödinger, notre compréhension de l'atome a évolué. Merci d'avoir regardé !");}}
];

function show(id){$(id).classList.add("show")}
function hide(id){$(id).classList.remove("show","talk","bounce")}
function hideAll(){["jax","bubble","caine","pomni"].forEach(hide)}
function say(w,t){
 $("speaker").textContent=w;
 $("words").textContent=t;
 show("dialogue");
 document.querySelectorAll(".actor").forEach(a=>a.classList.remove("talk"));
 let actor={JAX:"jax",BUBBLE:"bubble",CAINE:"caine",POMNI:"pomni"}[w];
 if(actor){show(actor);$(actor).classList.add("talk","bounce");}
 speak(w,t);
}
function speak(w,t){
 if(!voice||!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(t);
 u.lang="fr-FR";
 let v=voiceChoice[w]||voiceChoice.NARRATEUR;
 u.pitch=v.pitch;u.rate=v.rate;u.volume=1;
 let voices=speechSynthesis.getVoices();
 let french=voices.find(x=>x.lang.toLowerCase().startsWith("fr"));
 if(french)u.voice=french;
 u.onend=()=>{document.querySelectorAll(".actor").forEach(a=>a.classList.remove("talk"));};
 speechSynthesis.speak(u);
}
function explain(title,desc,kind){
 $("exTitle").textContent=title;
 $("exText").textContent=desc;
 let d="";
 if(kind==="solid")d='<circle cx="90" cy="90" r="52" fill="#72caff" stroke="white" stroke-width="4"/>';
 if(kind==="thomson")d='<circle cx="90" cy="90" r="52" fill="#efb25c"/>'+[0,1,2,3,4,5,6].map(i=>`<circle cx="${55+(i%3)*34}" cy="${58+Math.floor(i/3)*34}" r="7" fill="#174bc1"/>`).join("");
 if(kind==="rutherford"||kind==="bohr")d='<ellipse cx="90" cy="90" rx="72" ry="28" fill="none" stroke="#6ed9ff" stroke-width="3"/><circle cx="90" cy="90" r="12" fill="#ffb05c"/><circle cx="160" cy="90" r="6" fill="#c5f5ff"/>';
 if(kind==="quantum")d='<circle cx="90" cy="90" r="70" fill="#3786e9" opacity=".18"/><circle cx="90" cy="90" r="48" fill="#6edaff" opacity=".35"/><circle cx="90" cy="90" r="25" fill="#b5f4ff" opacity=".7"/><circle cx="90" cy="90" r="9" fill="white"/>';
 $("atomArt").innerHTML=d;
 show("explanation");
}
function start(){if(playing)return;playing=true;paused=false;$("play").style.display="none";if(!window.speechSynthesis)voice=false;run()}
function run(){
 if(!playing||paused)return;
 if(scene>=data.length){playing=false;return}
 let id=++runId;
 $("bar").style.width=(scene/data.length*100)+"%";
 data[scene].act();
 timer=setTimeout(()=>{if(id!==runId||paused)return;scene++;run()},data[scene].duration);
}
function next(){if(!playing){start();return}clearTimeout(timer);runId++;speechSynthesis.cancel();scene=Math.min(scene+1,data.length-1);run()}
function previous(){if(!playing)return;clearTimeout(timer);runId++;speechSynthesis.cancel();scene=Math.max(0,scene-1);run()}
function pause(){if(!playing)return;paused=!paused;$("pauseBtn").textContent=paused?"▶":"Ⅱ";if(paused){clearTimeout(timer);speechSynthesis.pause()}else{speechSynthesis.resume();run()}}
function voiceToggle(){voice=!voice;$("voiceBtn").textContent=voice?"🔊":"🔇";if(!voice)speechSynthesis.cancel()}
for(let i=0;i<85;i++){let s=document.createElement("i");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*3+"s";$("stars").appendChild(s)}
if("speechSynthesis" in window)speechSynthesis.getVoices();
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")previous();if(e.key===" "){e.preventDefault();pause()}});
</script>
</body>
 </html>
