<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE AMAZING L'ATOME — Épisode Spécial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #241442 0%, #090614 70%, #04030a 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .episode-frame {
      width: 100%;
      max-width: 560px;
      background: rgba(16, 12, 34, 0.92);
      border: 2px solid rgba(250, 204, 21, 0.35);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    /* ================= شاشة البداية (INTRO / POSTER) ================= */
    .intro-screen {
      padding: 20px;
      background: linear-gradient(135deg, #ff4d6d 0%, #ffbe0b 35%, #3a86ff 72%, #8338ec 100%);
      position: relative;
      text-align: center;
      min-height: 540px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .intro-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.12), rgba(10,6,24,0.68));
      pointer-events: none;
    }

    .intro-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .ep-tag {
      background: rgba(15, 10, 30, 0.82);
      color: #fde047;
      border: 1px solid #fde047;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .poster-box {
      width: 100%;
      max-height: 290px;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 14px 30px rgba(0,0,0,0.5);
      background: #140d2b;
    }

    .poster-box img {
      width: 100%;
      height: 290px;
      object-fit: cover;
      display: block;
    }

    .circus-logo {
      font-weight: 900;
      line-height: 0.98;
      text-shadow: 0 4px 0 #1e1b4b, 0 8px 20px rgba(0,0,0,0.65);
    }

    .circus-sub {
      font-size: 15px;
      color: #fef08a;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .circus-main {
      font-size: 46px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ef4444, #facc15, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 0 rgba(15, 10, 30, 0.95));
    }

    .start-episode-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 15px 20px;
      border: none;
      border-radius: 16px;
      background: #facc15;
      color: #18181b;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #a16207, 0 12px 24px rgba(0,0,0,0.45);
      transition: transform 0.15s ease;
    }

    .start-episode-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #a16207;
    }

    /* ================= شاشة الحلقة (EPISODE STAGE) ================= */
    .episode-screen {
      display: none;
      padding: 16px;
    }

    .episode-screen.active {
      display: block;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #c4b5fd;
    }

    .model-badge {
      background: rgba(139, 92, 246, 0.25);
      border: 1px solid rgba(250, 204, 21, 0.45);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 800;
      color: #fde047;
    }

    .mini-link-btn {
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .atom-stage {
      width: 100%;
      height: 205px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.25) 0%, rgba(9, 7, 22, 0.94) 78%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .atom-caption {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      text-align: center;
      font-size: 12px;
      color: #ede9fe;
      background: rgba(10, 7, 24, 0.75);
      padding: 4px 10px;
      border-radius: 10px;
    }

    .characters-stage {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 22px;
      margin-bottom: 12px;
    }

    .character-box {
      width: 124px;
      opacity: 0.68;
      transform: scale(0.95);
      transition: transform 0.25s ease, filter 0.25s ease, opacity 0.25s ease;
      animation: idleFloat 3.2s ease-in-out infinite;
    }

    .character-box.speaking {
      opacity: 1;
      transform: scale(1.06);
      filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.9));
    }

    .character-box.pomni.speaking {
      filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.88));
    }

    .character-box.pomni {
      animation-delay: 1.4s;
    }

    @keyframes idleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .dialogue-box {
      background: rgba(28, 22, 60, 0.92);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 18px;
      padding: 14px 16px;
      min-height: 138px;
      margin-bottom: 12px;
    }

    .speaker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .speaker-name {
      font-weight: 900;
      letter-spacing: 0.7px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .speaker-jax { color: #c084fc; }
    .speaker-pomni { color: #f87171; }
    .speaker-caine { color: #facc15; }

    .step-counter {
      font-size: 12px;
      color: #94a3b8;
    }

    .dialogue-text {
      font-size: 15px;
      line-height: 1.55;
      color: #f1f5f9;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .controls .full-span {
      grid-column: span 2;
    }

    button.ctrl-btn {
      border: none;
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button.ctrl-btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #8b5cf6;
      color: #fff;
    }

    .btn-secondary {
      background: #262146;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-voice-on {
      background: #22c55e;
      color: #052e16;
    }

    .btn-voice-off {
      background: #f59e0b;
      color: #1c1917;
    }
  </style>
</head>

  <script>
    const scenes = [
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        voiceStyle: { pitch: 0.85, rate: 1.06 },
        model: "Dalton (1803)",
        caption: "Dalton : sphère pleine et indivisible (aucune fissure !).",
        mode: "dalton",
        text: "Bienvenue dans L'ATOME, Pomni ! On commence avec Dalton : pour lui, l’atome est une boule pleine, dure, impossible à casser. Un peu comme mon crâne quand tu cries !"
      },
      {
        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        voiceStyle: { pitch: 1.32, rate: 1.12 },
        model: "Dalton (1803)",
        caption: "Dalton : rien à l'intérieur selon ce modèle.",
        mode: "dalton",
        text: "J-Jax... si c’est juste une boule pleine, ça veut dire qu’il n’y a même pas une petite porte cachée dedans ?! Je veux rentrer chez moi !"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        voiceStyle: { pitch: 0.85, rate: 1.06 },
        model: "Thomson (1897)",
        caption: "Thomson : 'Plum Pudding' — pâte positive et électrons (-).",
        mode: "thomson",
        text: "Pas de porte, désolé ! Ensuite arrive Thomson avec son modèle du Plum Pudding : une grosse pâte positive avec des électrons négatifs collés dedans. Genre un gâteau aux pépites... mais sans dessert."
      },
      {
        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        voiceStyle: { pitch: 1.32, rate: 1.12 },
        model: "Thomson (1897)",
        caption: "Thomson : électrons négatifs répartis dans la masse.",
        mode: "thomson",
        text: "Un gâteau ?! On est dans une aventure surréaliste et tu me parles de pâtisserie ?! Pourquoi les électrons ne tombent pas tous au centre ?"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        voiceStyle: { pitch: 0.85, rate: 1.06 },
        model: "Rutherford (1911)",
        caption: "Rutherford : petit noyau dense au centre + beaucoup de vide.",
        mode: "rutherford",
        text: "Voilà RUTHERFORD ! Il a envoyé des particules : presque tout est passé direct... sauf un minuscule noyau hyper dense au centre ! Comme un caillou au milieu d’un grand stade vide."
      },
      {
        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        voiceStyle: { pitch: 1.32, rate: 1.12 },
        model: "Rutherford (1911)",
        caption: "Rutherford : l'atome est composé surtout de vide !",
        mode: "rutherford",
        text: "D-du vide ?! Tu veux dire que tout ce qui nous entoure est surtout du vide avec des trucs qui tournent à fond ?! J’ai la tête qui tourne !"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        voiceStyle: { pitch: 0.85, rate: 1.06 },
        model: "Bohr (1913)",
        caption: "Bohr : orbites circulaires précises autour du noyau.",
        mode: "bohr",
        text: "Respire un coup, voilà BOHR ! Il a mis de l’ordre : les électrons suivent des orbites circulaires précises, comme des autoroutes bien tracées... jusqu’à ce que quelqu’un fasse n’importe quoi."
      },
      {
        speaker: "CAINE",
        roleClass: "speaker-caine",
        activeChar: "char-jax",
        voiceStyle: { pitch: 1.15, rate: 1.18 },
        model: "Bohr (1913)",
        caption: "Caine : saut d'orbite = émission de lumière !",
        mode: "bohr",

        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        voiceStyle: { pitch: 1.32, rate: 1.12 },
        model: "Schrödinger (1926)",
        caption: "Schrödinger : nuage de probabilité (zones où l'électron peut être).",
        mode: "schrodinger",
        text: "Jax, Caine me fait peur... Et maintenant tu dis qu’on arrive à SCHRÖDINGER ? Plus de rail fixe, juste un nuage de probabilité ?!"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        voiceStyle: { pitch: 0.85, rate: 1.06 },
        model: "Schrödinger (1926)",
        caption: "Schrödinger : probabilité de présence plutôt qu'une trajectoire exacte.",
        mode: "schrodinger",
        text: "Bingo ! Avec Schrödinger, on parle de probabilité de présence dans un nuage. Un peu comme toi, Pomni : on sait que tu vas paniquer quelque part... mais jamais à la seconde près !"

    let currentIndex = 0;
    let voiceEnabled = true;
    let tick = 0;

    const introScreen = document.getElementById("intro-screen");
    const episodeScreen = document.getElementById("episode-screen");
    const startEpisodeBtn = document.getElementById("start-episode-btn");
    const backIntroBtn = document.getElementById("back-intro-btn");

    const atomSvg = document.getElementById("atom-svg");
    const atomCaption = document.getElementById("atom-caption");
    const modelBadge = document.getElementById("model-badge");
    const speakerName = document.getElementById("speaker-name");
    const dialogueText = document.getElementById("dialogue-text");
    const stepCounter = document.getElementById("step-counter");
    const charJax = document.getElementById("char-jax");
    const charPomni = document.getElementById("char-pomni");
    const voiceToggleBtn = document.getElementById("voice-toggle-btn");

    function speakLine(scene) {
      if (!voiceEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(scene.text);
      utter.lang = "fr-FR";
      utter.pitch = scene.voiceStyle.pitch;
      utter.rate = scene.voiceStyle.rate;

      const voices = window.speechSynthesis.getVoices();
      const frVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
      if (frVoice) utter.voice = frVoice;

      window.speechSynthesis.speak(utter);
    }

    function createEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }

    function renderAtomFrame(mode, t) {
      atomSvg.innerHTML = "";
      const cx = 160;
      const cy = 86;

      if (mode === "dalton") {
        const pulse = 52 + Math.sin(t * 0.04) * 2;
        atomSvg.appendChild(createEl("circle", {
          cx, cy, r: pulse,
          fill: "#8b5cf6", stroke: "#ddd6fe", "stroke-width": "3"
        }));
      } else if (mode === "thomson") {
        atomSvg.appendChild(createEl("circle", {
          cx, cy, r: 56,
          fill: "rgba(244, 63, 94, 0.28)", stroke: "#fb7185", "stroke-width": "3"
        }));
        const dots = [[-25, -16], [22, -22], [0, -5], [-26, 16], [18, 20], [30, 2]];
        dots.forEach(([dx, dy], i) => {
          atomSvg.appendChild(createEl("circle", {
            cx: cx + dx + Math.cos(t * 0.05 + i) * 3,
            cy: cy + dy + Math.sin(t * 0.05 + i) * 3,
            r: 6.5, fill: "#38bdf8"
          }));
        });
      } else if (mode === "rutherford") {
        for (let idx = 0; idx < 4; idx++) {
          const rot = t * 0.035 + (idx * Math.PI) / 2;
          atomSvg.appendChild(createEl("ellipse", {
            cx, cy, rx: 76, ry: 26,
            fill: "none", stroke: "rgba(196, 181, 253, 0.35)", "stroke-width": "1.5",
            transform: `rotate(${idx * 45} ${cx} ${cy})`
          }));
          const rad = (idx * 45 * Math.PI) / 180;
          const ex = cx + 76 * Math.cos(rot) * Math.cos(rad) - 26 * Math.sin(rot) * Math.sin(rad);
          const ey = cy + 76 * Math.cos(rot) * Math.sin(rad) + 26 * Math.sin(rot) * Math.cos(rad);
          atomSvg.appendChild(createEl("circle", { cx: ex, cy: ey, r: 6, fill: "#22d3ee" }));
        }
        atomSvg.appendChild(createEl("circle", { cx, cy, r: 11, fill: "#facc15" }));
      } else if (mode === "bohr") {
        const radii = [30, 52, 74];
        const speeds = [0.05, -0.032, 0.022];
        radii.forEach((r, i) => {
          atomSvg.appendChild(createEl("circle", {
            cx, cy, r,
            fill: "none", stroke: "rgba(167, 139, 250, 0.45)", "stroke-width": "2"
          }));
          const a = t * speeds[i] + i;
          atomSvg.appendChild(createEl("circle", {
            cx: cx + r * Math.cos(a),
            cy: cy + r * Math.sin(a),
            r: 6.5, fill: i === 1 ? "#f43f5e" : "#4ade80"
          }));
        });
        atomSvg.appendChild(createEl("circle", { cx, cy, r: 12, fill: "#f59e0b" }));
      } else if (mode === "schrodinger") {
        for (let i = 0; i < 28; i++) {
          const angle = i * 2.39996 + t * 0.015;
          const dist = 15 + ((i * 19 + Math.sin(t * 0.03 + i) * 14) % 56);
          const px = cx + Math.cos(angle) * dist * 1.35;
          const py = cy + Math.sin(angle) * dist * 0.82;
          const opacity = 0.2 + 0.6 * Math.abs(Math.sin(t * 0.04 + i));
          atomSvg.appendChild(createEl("circle", {
            cx: px, cy: py, r: (i % 3 === 0) ? 5 : 3,
            fill: (i % 2 === 0) ? "#c084fc" : "#38bdf8",
            opacity: opacity.toFixed(2)
          }));
        }
        atomSvg.appendChild(createEl("circle", { cx, cy, r: 9, fill: "#fde047" }));
      }
    }

    function updateScene(shouldSpeak = true) {
      const s = scenes[currentIndex];
      modelBadge.textContent = `Modèle : ${s.model}`;
      atomCaption.textContent = s.caption;
      speakerName.textContent = s.speaker;
      speakerName.className = `speaker-name ${s.roleClass}`;
      dialogueText.textContent = s.text;
      stepCounter.textContent = `${currentIndex + 1} / ${scenes.length}`;

      charJax.classList.toggle("speaking", s.activeChar === "char-jax");
      charPomni.classList.toggle("speaking", s.activeChar === "char-pomni");

      if (shouldSpeak) {
        speakLine(s);
      }
    }

    function loop() {
      tick += 1;
      renderAtomFrame(scenes[currentIndex].mode, tick);
      requestAnimationFrame(loop);
    }

    startEpisodeBtn.addEventListener("click", () => {
      introScreen.style.display = "none";
      episodeScreen.classList.add("active");
      updateScene(true);
    });

    backIntroBtn.addEventListener("click", () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      episodeScreen.classList.remove("active");
      introScreen.style.display = "flex";
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % scenes.length;
      updateScene(true);
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + scenes.length) % scenes.length;
      updateScene(true);
    });

    document.getElementById("replay-voice-btn").addEventListener("click", () => {
      speakLine(scenes[currentIndex]);
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      currentIndex = 0;
      updateScene(true);
    });

    voiceToggleBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      if (!voiceEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      voiceToggleBtn.className = `ctrl-btn full-span ${voiceEnabled ? "btn-voice-on" : "btn-voice-off"}`;
      voiceToggleBtn.textContent = voiceEnabled
        ? "🔊 Voix : Activée (Cliquer pour lire)"
        : "🔇 Voix : Désactivée";
      if (voiceEnabled) speakLine(scenes[currentIndex]);
    });

    updateScene(false);
    loop();
  </script>
</body>
</html>
