
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030713">
<title>L’ATOME — Au cœur de la matière</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030713;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#screen {
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 500px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: radial-gradient(circle at center, #17365d, #030713 75%);
  transition: background 1s;
}

.stars {
  position: absolute;
  inset: -100px;
  pointer-events: none;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(#70caff 1px, transparent 1px),
    radial-gradient(#ffffff 1px, transparent 1px);
  background-size: 65px 65px, 110px 110px, 170px 170px;
  animation: starMove 35s linear infinite;
  opacity: .65;
}

@keyframes starMove {
  to { transform: translateY(180px); }
}

#content {
  position: relative;
  z-index: 3;
  width: min(900px, 90%);
  max-height: 78%;
  overflow-y: auto;
  text-align: center;
  padding: 15px 5px 30px;
  animation: appear .8s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  color: #75caff;
  font-size: 12px;
  letter-spacing: 5px;
  margin-bottom: 20px;
}

h1 {
  font-size: clamp(43px, 12vw, 105px);
  letter-spacing: 7px;
  text-shadow: 0 0 15px #168fff, 0 0 45px #168fff;
}

h2 {
  font-size: clamp(25px, 6vw, 43px);
  color: #8bd5ff;
  margin: 15px 0;
}

.subtitle {
  margin-top: 18px;
  color: #c3dcf7;
  letter-spacing: 4px;
  font-size: clamp(11px, 3vw, 17px);
}

.description {
  color: #c5d5e9;
  line-height: 1.8;
  margin: 20px auto;
  max-width: 650px;
  font-size: clamp(14px, 3vw, 18px);
}

.dialogue {
  background: #081a30eF;
  border: 1px solid #348bc5;
  border-radius: 15px;
  padding: 18px;
  margin: 20px auto;
  max-width: 650px;
  line-height: 1.8;
  box-shadow: 0 0 25px #168fff20;
}

.speaker {
  color: #77caff;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.character {
  width: 125px;
  height: 125px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 25px;
  margin: 15px auto;
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 2px;
  animation: float 3s ease-in-out infinite;
  box-shadow: 0 0 35px #0008;
}

.jax {
  background: linear-gradient(145deg,#a64cc0,#38104e);
  border: 2px solid #d38aff;
}

.bubble {
  background: radial-gradient(circle at 30% 25%,#e5ffff,#5bdafa,#0877aa);
  color: #08324b;
  border-radius: 50%;
}

.caine {
  background: linear-gradient(145deg,#fff0dc,#a52e39);
  color: #4a1018;
  border: 2px solid #ffb7a4;
}

.pomni {
  background: linear-gradient(145deg,#ed5c76,#6d244e);
  border: 2px solid #ffb1c9;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.model-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin: 20px auto;
}

.model-card {
  width: min(260px, 100%);
  padding: 20px;
  border: 1px solid #3378a8;
  background: #0b1c32;
  border-radius: 16px;
}

.model-card h3 {
  color: #7bcaff;
  margin-bottom: 12px;
}

.model-card p {
  color: #c6d9eb;
  font-size: 14px;
  line-height: 1.7;
}

.sphere {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  margin: 12px auto;
  background: radial-gradient(circle at 30% 25%,#9de6ff,#2678d1,#102d68);
  box-shadow: 0 0 25px #258fff;
}

.atom {
  width: 120px;
  height: 120px;
  position: relative;
  margin: 15px auto;
}

.nucleus {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #ff9a43;
  box-shadow: 0 0 25px #ff732b;
  top: 50px;
  left: 50px;
}

.orbit {
  position: absolute;
  width: 120px;
  height: 44px;
  border: 2px solid #5abfff;
  border-radius: 50%;
  top: 38px;
  left: 0;
}

.orbit.a { transform: rotate(60deg); }
.orbit.b { transform: rotate(-60deg); }

.electron {
  position: absolute;
  top: -5px;
  left: 55px;
  width: 9px;
  height: 9px;
  background: #c7f4ff;
  border-radius: 50%;
  box-shadow: 0 0 12px #62caff;
}

.quantum {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  margin: 15px auto;
  background: radial-gradient(circle, #ffffff 2%, #65baff 15%, #2359a4 45%, transparent 72%);
  box-shadow: 0 0 30px #318bff;
  animation: pulse 2s infinite alternate;
}

@keyframes pulse {
  to { transform: scale(1.15); opacity: .7; }
}

/* Les rideaux sont cachés par défaut */
.curtain {
  position: absolute;
  z-index: 5;
  top: 0;
  bottom: 0;
  width: 50%;
  pointer-events: none;
  background: repeating-linear-gradient(
    90deg,
    #51091c,
    #a91d3e 25px,
    #650d29 50px
  );
  transition: transform 1.7s ease;
  transform: translateX(-110%);
}

#leftCurtain { left: 0; }
#rightCurtain {
  right: 0;
  transform: translateX(110%);
}

.curtain-show#leftCurtain {
  transform: translateX(0);
}

.curtain-show#rightCurtain {
  transform: translateX(0);
}

.curtain-open#leftCurtain {
  transform: translateX(-110%);
}

.curtain-open#rightCurtain {
  transform: translateX(110%);
}

#controls {
  position: absolute;
  z-index: 10;
  bottom: 17px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
}

button {
  background: #0c3157;
  color: white;
  border: 1px solid #55baff;
  border-radius: 30px;
  padding: 12px 19px;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: 1px;
}

button:active {
  background: #1879bd;
  transform: scale(.96);
}

#counter {
  color: #a9d8fa;
  font-size: 12px;
}

#screen.glitch {
  animation: glitch .3s 4;
}

@keyframes glitch {
  0% { transform: translate(0); filter: none; }
  25% { transform: translate(7px,-3px); filter: hue-rotate(90deg); }
  50% { transform: translate(-6px,3px); filter: invert(.5); }
  75% { transform: translate(3px,2px); }
  100% { transform: translate(0); filter: none; }
}

.pop {
  animation: pop .5s forwards;
}

@keyframes pop {
  to { transform: scale(0); opacity: 0; }
}

#screen.flash {
  animation: flash .5s;
}

@keyframes flash {
  50% { filter: brightness(3); }
}

@media(max-width:500px) {
  #content { max-height: 75%; }
  .character { width: 100px; height: 100px; }
  .model-card { padding: 14px; }
  button { padding: 10px 13px; font-size: 10px; }
  #controls { gap: 8px; bottom: 12px; }
}
</style>
</head>

<body>

<div id="screen">
  <div class="stars"></div>

  <div id="content"></div>

  <div class="curtain" id="leftCurtain"></div>
  <div class="curtain" id="rightCurtain"></div>

  <div id="controls">
    <button onclick="previousScene()">PRÉCÉDENT</button>
    <span id="counter">01 / 14</span>
    <button onclick="nextScene()">SUIVANT</button>
  </div>
</div>

<script>
const scenes = [

{
bg: "radial-gradient(circle,#15365f,#030713 75%)",
html: `
<div class="eyebrow">UNE AVENTURE COMMENCE...</div>
<h1>UNIVERS</h1>
<p class="description">Au milieu de l'immensité de l'espace, une découverte nous attend.</p>
<div style="font-size:75px">✨ 🌌 ✨</div>
`
},

{
bg: "radial-gradient(circle,#15547a,#030713)",
html: `
<div class="eyebrow">NOTRE PLANÈTE</div>
<h2>LA TERRE</h2>
<div style="font-size:110px;animation:float 4s infinite">🌍</div>
<p class="description">C'est ici que commence notre voyage au cœur de la matière.</p>
`
},

{
bg: "radial-gradient(circle,#421653,#030713)",
html: `
<div class="character jax">JAX</div>
<h2>Bonjour tout le monde !</h2>
<div class="dialogue">
<div class="speaker">JAX</div>
Bienvenue dans notre incroyable voyage au cœur de la matière !
</div>
`
},

{
bg: "radial-gradient(circle,#37101e,#030713)",
curtain: true,
html: `
<div class="eyebrow">PRÉSENTE</div>
<h1>L’ATOME</h1>
<p class="subtitle">AU CŒUR DE LA MATIÈRE</p>
<p class="description">L'histoire de notre compréhension de l'infiniment petit.</p>
`
},

{
bg: "radial-gradient(circle,#125276,#030713)",
html: `
<div class="character bubble">BUBBLE</div>
<div class="dialogue">
<div class="speaker">BUBBLE</div>
Jax ! On commence par Schrödinger ? C'est mon préféré !
</div>
`
},

{
bg: "radial-gradient(circle,#351346,#030713)",
pop: true,
html: `
<div class="character bubble" id="bubblePop">BUBBLE</div>
<h2>POP !</h2>
<div class="dialogue">
<div class="speaker">JAX</div>
Bon... assez de distractions ! Commençons par une question simple : qu'est-ce qu'un atome ?
</div>
`
},

{
bg: "radial-gradient(circle,#15365e,#030713)",
html: `
<div class="character jax">JAX</div>
<h2>John Dalton</h2>
<div class="model-grid">
<div class="model-card">
<h3>La sphère solide</h3>
<div class="sphere"></div>
<p>Dans son modèle historique, Dalton considère l'atome comme une sphère solide, indivisible et indestructible.</p>
</div>
</div>
<div class="dialogue">
<div class="speaker">JAX</div>
Pour Dalton, toute matière est constituée de minuscules atomes !
</div>
`
},

{
bg: "radial-gradient(circle,#15365e,#030713)",
html: `
<div class="character jax">JAX</div>
<h2>J. J. Thomson</h2>
<div class="model-grid">
<div class="model-card">
<h3>Le modèle de Thomson</h3>
<div style="font-size:55px">🟠</div>
<p>Des électrons négatifs sont répartis dans une sphère de matière chargée positivement.</p>
</div>
</div>
<div class="dialogue">
<div class="speaker">JAX</div>
Thomson découvre l'électron et propose un nouveau modèle atomique !
</div>
`
},

{
bg: "radial-gradient(circle,#692322,#030713)",
html: `
<div class="character caine">CAINE</div>
<h2>JAX ! DEHORS !</h2>
<div class="dialogue">
<div class="speaker">CAINE</div>
Merci pour cette présentation ! Maintenant, laissez-moi continuer !
</div>
<p class="description">Caine chasse Jax de la scène et prend sa place.</p>
<div style="font-size:35px">🏃‍♂️</div>
`
},

{
bg: "radial-gradient(circle,#163d63,#030713)",
html: `
<div class="character caine">CAINE</div>
<h2>Ernest Rutherford</h2>
<div class="model-grid">
<div class="model-card">
<h3>Le noyau atomique</h3>
<div class="atom">
<div class="orbit"></div>
<div class="nucleus"></div>
</div>
<p>Un petit noyau positif au centre. L'atome est essentiellement constitué de vide.</p>
</div>
</div>
<div class="dialogue">
<div class="speaker">CAINE</div>
Rutherford met en évidence l'existence du noyau atomique !
</div>
`
},

{
bg: "radial-gradient(circle,#163d63,#030713)",
html: `
<div class="character caine">CAINE</div>
<h2>Niels Bohr</h2>
<div class="model-grid">
<div class="model-card">
<h3>Les niveaux d'énergie</h3>
<div class="atom">
<div class="orbit"></div>
<div class="orbit a"></div>
<div class="nucleus"></div>
</div>
<p>Les électrons occupent des niveaux d'énergie bien définis.</p>
</div>
</div>
<div class="dialogue">
<div class="speaker">CAINE</div>
Bohr améliore le modèle atomique en introduisant les niveaux d'énergie !
</div>
`
},

{
bg: "radial-gradient(circle,#125276,#030713)",
html: `
<div class="character bubble">BUBBLE</div>
<div class="dialogue">
<div class="speaker">BUBBLE</div>
Caine ! Caine ! Et Schrödinger ? On va parler de Schrödinger ?!
</div>
<h2>Encore toi ?!</h2>
<p class="description">Bubble revient et interrompt la présentation une nouvelle fois.</p>
`
},

{
bg: "radial-gradient(circle,#64202b,#030713)",
glitch: true,
html: `
<div class="character caine">CAINE</div>
<h2>ÇA SUFFIT !</h2>
<div class="dialogue">
<div class="speaker">CAINE</div>
Dehors, Bubble ! Laissez-moi terminer !
</div>
<p class="description">Caine chasse Bubble, puis frappe l'écran dans un accès de colère...</p>
<div style="font-size:45px">⚡</div>
`
},

{
bg: "radial-gradient(circle,#4a1941,#030713)",
html: `
<div class="character pomni">POMNI</div>
<h2>Bonjour... euh... tout le monde !</h2>
<div class="dialogue">
<div class="speaker">POMNI</div>
Attendez... Je vais essayer de réparer cet écran.
</div>
<p class="description">Pomni rétablit l'affichage et remet le spectacle en marche.</p>
`
},

{
bg: "radial-gradient(circle,#1c3d75,#030713)",
html: `
<div class="character jax">JAX</div>
<div class="dialogue">
<div class="speaker">JAX</div>
Bon, nous étions justement sur le point de découvrir Schrödinger...
</div>
<div class="character pomni">POMNI</div>
<h2>Erwin Schrödinger</h2>
<div class="model-grid">
<div class="model-card">
<h3>Le modèle quantique</h3>
<div class="quantum"></div>
<p>Les électrons sont décrits par une fonction d'onde. Les orbitales représentent des régions où leur présence est probable.</p>
</div>
</div>
<div class="dialogue">
<div class="speaker">POMNI</div>
Dans ce modèle, on ne décrit plus les électrons comme de petites planètes suivant des orbites précises !
</div>
`
},

{
bg: "radial-gradient(circle,#143e68,#030713)",
html: `
<div class="eyebrow">FIN DE L'EXPLORATION</div>
<h1>L’ATOME</h1>
<p class="subtitle">AU CŒUR DE LA MATIÈRE</p>
<div class="atom">
<div class="orbit"></div>
<div class="orbit a"></div>
<div class="orbit b"></div>
<div class="nucleus"></div>
</div>
<h2>Merci pour votre attention !</h2>
<p class="description">De Dalton à Schrödinger, notre compréhension de l'atome a évolué au fil des découvertes scientifiques.</p>
`
}

];

let current = 0;

function render() {
  const scene = scenes[current];
  const screen = document.getElementById("screen");
  const content = document.getElementById("content");
  const left = document.getElementById("leftCurtain");
  const right = document.getElementById("rightCurtain");

  content.style.animation = "none";
  content.offsetHeight;
  content.style.animation = "appear .8s ease";
  content.innerHTML = scene.html;

  screen.style.background = scene.bg;
  screen.classList.remove("glitch", "flash");

  left.className = "curtain";
  right.className = "curtain";

  if (scene.curtain) {
    left.classList.add("curtain-show");
    right.classList.add("curtain-show");

    setTimeout(() => {
      if (current === 3) {
        left.classList.add("curtain-open");
        right.classList.add("curtain-open");
      }
    }, 800);
  }

  if (scene.pop) {
    setTimeout(() => {
      const bubble = document.getElementById("bubblePop");
      if (bubble) bubble.classList.add("pop");
    }, 900);
  }

  if (scene.glitch) {
    setTimeout(() => {
      screen.classList.add("glitch", "flash");
    }, 400);
  }

  document.getElementById("counter").textContent =
    String(current + 1).padStart(2, "0") + " / " + scenes.length;
}

function nextScene() {
  if (current < scenes.length - 1) {
    current++;
    render();
  }
}

function previousScene() {
  if (current > 0) {
    current--;
    render();
  }
}

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight" || event.key === " ") nextScene();
  if (event.key === "ArrowLeft") previousScene();
});

render();
</script>

</body>
  </html>
