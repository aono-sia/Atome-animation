<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modèles Atomiques — The Amazing Digital Circus</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e1538 0%, #090714 65%, #05040c 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      background: rgba(18, 14, 38, 0.88);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
      color: #c4b5fd;
    }

    .model-badge {
      background: rgba(139, 92, 246, 0.22);
      border: 1px solid rgba(196, 181, 253, 0.4);
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 700;
      color: #fde047;
    }

    /* مسرح الذرات المتحركة */
    .atom-stage {
      width: 100%;
      height: 220px;
      background: radial-gradient(circle, rgba(88, 28, 135, 0.25) 0%, rgba(10, 8, 24, 0.9) 75%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .atom-caption {
      position: absolute;
      bottom: 8px;
      left: 12px;
      right: 12px;
      text-align: center;
      font-size: 12px;
      color: #ddd6fe;
      background: rgba(9, 7, 20, 0.65);
      padding: 4px 10px;
      border-radius: 10px;
    }

    /* الشخصيات */
    .characters-stage {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 12px;
    }

    .character-box {
      width: 128px;
      opacity: 0.72;
      transform: scale(0.95);
      transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
      animation: idleFloat 3.2s ease-in-out infinite;
    }

    .character-box.speaking {
      opacity: 1;
      transform: scale(1.06);
      filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.9));
    }

    .character-box.pomni.speaking {
      filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.85));
    }

    .character-box.pomni {
      animation-delay: 1.4s;
    }

    @keyframes idleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* صندوق الحوار */
    .dialogue-box {
      background: rgba(30, 24, 64, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 18px;
      padding: 16px;
      min-height: 132px;
      margin-bottom: 14px;
    }

    .speaker-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .speaker-name {
      font-weight: 800;
      letter-spacing: 0.6px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .speaker-jax { color: #c084fc; }
    .speaker-pomni { color: #f87171; }
    .speaker-caine { color: #facc15; }

    .step-counter {
      font-size: 12px;
      color: #94a3b8;
    }

    .dialogue-text {
      font-size: 15px;
      line-height: 1.55;
      color: #f1f5f9;
    }

    /* الأزرار */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #8b5cf6;
      color: white;
    }

    .btn-secondary {
      background: #272247;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-accent {
      background: #eab308;
      color: #18181b;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <span>🎪 Labo Quantique & Comédie</span>
      <span class="model-badge" id="model-badge">Modèle : Dalton</span>
    </div>

    <!-- مسرح الذرة المتحركة -->
    <div class="atom-stage">
      <svg id="atom-svg" viewBox="0 0 320 190" width="320" height="190"></svg>
      <div class="atom-caption" id="atom-caption">Sphère pleine et indivisible</div>
    </div>

    <!-- شخصيات Jax و Pomni -->
    <div class="characters-stage">
      <!-- JAX -->
      <div class="character-box jax speaking" id="char-jax">
        <svg viewBox="0 0 200 310" xmlns="http://www.w3.org/2000/svg">
          <path d="M72 110 C60 40, 62 10, 76 10 C88 10, 88 50, 88 110 Z" fill="#9b67e6" stroke="#4c1d95" stroke-width="4"/>
          <path d="M76 95 C69 45, 70 22, 76 22 C81 22, 82 48, 82 95 Z" fill="#c4b5fd"/>
          <path d="M128 110 C140 40, 138 10, 124 10 C112 10, 112 50, 112 110 Z" fill="#9b67e6" stroke="#4c1d95" stroke-width="4"/>
          <path d="M124 95 C131 45, 130 22, 124 22 C119 22, 118 48, 118 95 Z" fill="#c4b5fd"/>

          <path d="M68 185 L132 185 L140 282 C140 292, 60 292, 60 282 Z" fill="#e11d48" stroke="#4c1d95" stroke-width="4"/>
          <path d="M72 185 L128 185 L132 215 L68 215 Z" fill="#6d28d9"/>
          <rect x="75" y="183" width="12" height="35" rx="4" fill="#be123c" stroke="#4c1d95" stroke-width="3"/>
          <rect x="113" y="183" width="12" height="35" rx="4" fill="#be123c" stroke="#4c1d95" stroke-width="3"/>
          <circle cx="81" cy="212" r="5" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
          <circle cx="119" cy="212" r="5" fill="#facc15" stroke="#854d0e" stroke-width="2"/>

          <path d="M68 190 Q42 225 55 258" fill="none" stroke="#9b67e6" stroke-width="11" stroke-linecap="round"/>
          <path d="M132 190 Q158 225 145 258" fill="none" stroke="#9b67e6" stroke-width="11" stroke-linecap="round"/>
          <circle cx="55" cy="260" r="10" fill="#fef08a" stroke="#854d0e" stroke-width="3"/>
          <circle cx="145" cy="260" r="10" fill="#fef08a" stroke="#854d0e" stroke-width="3"/>

          <ellipse cx="100" cy="142" rx="46" ry="42" fill="#9b67e6" stroke="#4c1d95" stroke-width="4"/>
          <ellipse cx="83" cy="134" rx="13" ry="16" fill="#fef9c3" stroke="#4c1d95" stroke-width="3"/>
          <ellipse cx="117" cy="134" rx="13" ry="16" fill="#fef9c3" stroke="#4c1d95" stroke-width="3"/>
          <rect x="82" y="128" width="5" height="12" rx="2" fill="#1e1b4b"/>
          <rect x="113" y="128" width="5" height="12" rx="2" fill="#1e1b4b"/>
          <path d="M70 126 Q83 132 96 126" fill="none" stroke="#4c1d95" stroke-width="3.5"/>
          <path d="M104 126 Q117 132 130 126" fill="none" stroke="#4c1d95" stroke-width="3.5"/>

          <path d="M74 156 Q100 176 126 156 Q100 166 74 156 Z" fill="#fef08a" stroke="#4c1d95" stroke-width="3"/>
          <line x1="88" y1="158" x2="88" y2="167" stroke="#4c1d95" stroke-width="2.5"/>
          <line x1="100" y1="160" x2="100" y2="169" stroke="#4c1d95" stroke-width="2.5"/>
          <line x1="112" y1="158" x2="112" y2="167" stroke="#4c1d95" stroke-width="2.5"/>
        </svg>
      </div>

      <!-- POMNI -->
      <div class="character-box pomni" id="char-pomni">
        <svg viewBox="0 0 200 310" xmlns="http://www.w3.org/2000/svg">
          <path d="M72 115 C35 85, 15 115, 25 145 C35 135, 55 130, 65 135 Z" fill="#ef4444" stroke="#1e293b" stroke-width="4"/>
          <circle cx="23" cy="147" r="9" fill="#facc15" stroke="#854d0e" stroke-width="3"/>
          <path d="M128 115 C165 85, 185 115, 175 145 C165 135, 145 130, 135 135 Z" fill="#2563eb" stroke="#1e293b" stroke-width="4"/>
          <circle cx="177" cy="147" r="9" fill="#facc15" stroke="#854d0e" stroke-width="3"/>

          <path d="M68 195 L132 195 L142 282 C142 292, 58 292, 58 282 Z" fill="#ef4444" stroke="#1e293b" stroke-width="4"/>
          <path d="M100 195 L132 195 L142 282 C142 288, 100 290, 100 290 Z" fill="#2563eb"/>
          <circle cx="100" cy="225" r="6" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
          <circle cx="100" cy="250" r="6" fill="#facc15" stroke="#854d0e" stroke-width="2"/>

          <path d="M68 200 Q45 230 58 260" fill="none" stroke="#2563eb" stroke-width="11" stroke-linecap="round"/>
          <path d="M132 200 Q155 230 142 260" fill="none" stroke="#ef4444" stroke-width="11" stroke-linecap="round"/>
          <circle cx="58" cy="262" r="10" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
          <circle cx="142" cy="262" r="10" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>

          <circle cx="100" cy="150" r="44" fill="#fde6d8" stroke="#1e293b" stroke-width="4"/>
          <path d="M58 138 Q100 95 142 138 Q100 125 58 138 Z" fill="#2563eb" stroke="#1e293b" stroke-width="4"/>
          <path d="M58 138 Q80 105 100 112 L100 131 Q78 131 58 138 Z" fill="#ef4444"/>
          <path d="M60 138 L66 155 L74 140 L84 152 L95 138 L105 152 L116 140 L126 155 L138 138" fill="#451a03"/>

          <ellipse cx="72" cy="166" rx="7" ry="4" fill="#fca5a5"/>
          <ellipse cx="128" cy="166" rx="7" ry="4" fill="#fca5a5"/>

          <circle cx="83" cy="154" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
          <circle cx="117" cy="154" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
          <circle cx="83" cy="154" r="6" fill="#ef4444"/>
          <circle cx="83" cy="154" r="2.5" fill="#1e293b"/>
          <circle cx="117" cy="154" r="6" fill="#2563eb"/>
          <circle cx="117" cy="154" r="2.5" fill="#1e293b"/>

          <path d="M70 137 Q83 132 93 139" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
          <path d="M107 139 Q117 132 130 137" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
          <path d="M88 176 Q94 172 100 176 Q106 180 112 176" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- الحوار -->
    <div class="dialogue-box">
      <div class="speaker-row">
        <span class="speaker-name speaker-jax" id="speaker-name">JAX</span>
        <span class="step-counter" id="step-counter">1 / 10</span>
      </div>
      <p class="dialogue-text" id="dialogue-text"></p>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls">
      <button class="btn-secondary" id="prev-btn">← Précédent</button>
      <button class="btn-primary" id="next-btn">Suivant →</button>
      <button class="btn-accent" id="auto-btn">▶ Auto-lecture</button>
      <button class="btn-secondary" id="reset-btn">↺ Recommencer</button>
    </div>
  </div>

  <script>
    const scenes = [
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        model: "Dalton (1803)",
        caption: "Dalton : une boule pleine et incassable (zéro bouton, zéro bug).",
        mode: "dalton",
        text: "Salut Pomni ! Regarde cette boule violette. C’est l’atome de Dalton : une sphère pleine, dure, impossible à casser. Un peu comme mon crâne quand tu poses trop de questions !"
      },
      {
        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        model: "Dalton (1803)",
        caption: "Dalton : simple mais incomplet sur l'intérieur.",
        mode: "dalton",
        text: "A-attends Jax... si c’est juste une boule pleine, ça veut dire qu’il n’y a rien dedans ? Même pas une petite sortie de secours ?!"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        model: "Thomson (1897)",
        caption: "Thomson : 'Plum Pudding' — pâte positive et électrons négatifs.",
        mode: "thomson",
        text: "Pas de sortie, désolé ! Puis Thomson est arrivé avec son 'Plum Pudding' : une grosse pâte positive avec des électrons négatifs collés dedans. On dirait un gâteau aux pépites de chocolat... mais sans sucre."
      },
      {
        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        model: "Thomson (1897)",
        caption: "Thomson : électrons (-) répartis dans une charge (+).",
        mode: "thomson",
        text: "Un gâteau ?! Jax, on est coincés dans un cirque numérique et tu me parles de pâtisserie ?! Et pourquoi les électrons ne tombent pas tous au milieu ?"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        model: "Rutherford (1911)",
        caption: "Rutherford : un minuscule noyau dense au centre + vide immense.",
        mode: "rutherford",
        text: "Bonne question, petite boule de stress ! Voilà RUTHERFORD ! Il a envoyé des particules, presque tout a traversé... sauf un petit noyau hyper dense au centre ! Comme un moustique blindé au milieu d’un stade vide."
      },
      {
        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        model: "Rutherford (1911)",
        caption: "Rutherford : presque tout est du vide !",
        mode: "rutherford",
        text: "D-du vide ?! Tu veux dire que tout ce qui nous entoure est surtout du vide avec des trucs qui tournent à toute vitesse ? J’ai le vertige rien qu’en regardant l’écran !"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        model: "Bohr (1913)",
        caption: "Bohr : orbites circulaires précises (niveaux d'énergie).",
        mode: "bohr",
        text: "Calme-toi, voilà BOHR ! Lui, il a mis de l’ordre : les électrons n’ont pas le droit d’aller n’importe où, ils suivent des pistes circulaires bien précises. Un peu comme des trains qui ne déraillent jamais... sauf quand Caine s’en mêle."
      },
      {
        speaker: "CAINE",
        roleClass: "speaker-caine",
        activeChar: "char-jax",
        model: "Bohr (1913)",
        caption: "Caine : 'QUI A DIT DÉRAILLER ?!'",
        mode: "bohr",
        text: "J’AI ENTENDU 'TRAIN' ET 'CATASTROPHE' ?! Mes chers amis, si un électron saute d’orbite, il émet de la lumière ! C’est du spectacle gratuit, mesdames et messieurs !"
      },
      {
        speaker: "POMNI",
        roleClass: "speaker-pomni",
        activeChar: "char-pomni",
        model: "Schrödinger (1926)",
        caption: "Schrödinger : nuage de probabilité (orbitales quantiques).",
        mode: "schrodinger",
        text: "Jax, Caine me fait encore plus peur... Et maintenant tu dis qu’on va parler de SCHRÖDINGER ? Là, l’électron n’est plus sur un rail fixe, il est dans un nuage de probabilité !"
      },
      {
        speaker: "JAX",
        roleClass: "speaker-jax",
        activeChar: "char-jax",
        model: "Schrödinger (1926)",
        caption: "Schrödinger : on ne suit plus une trajectoire exacte, mais une probabilité de présence.",
        mode: "schrodinger",
        text: "Exactement ! Avec Schrödinger, on ne dit plus 'l’électron est exactement là', mais 'il a de grandes chances d’être dans cette zone brumeuse'. Un peu comme toi, Pomni : on sait que tu paniques quelque part, mais on ne sait jamais exactement à quelle seconde !"
      }
    ];

    let currentIndex = 0;
    let autoTimer = null;
    let animFrame = null;
    let tick = 0;

    const atomSvg = document.getElementById("atom-svg");
    const atomCaption = document.getElementById("atom-caption");
    const modelBadge = document.getElementById("model-badge");
    const speakerName = document.getElementById("speaker-name");
    const dialogueText = document.getElementById("dialogue-text");
    const stepCounter = document.getElementById("step-counter");
    const charJax = document.getElementById("char-jax");
    const charPomni = document.getElementById("char-pomni");

    function createEl(tag, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }

    function renderAtomFrame(mode, t) {
      atomSvg.innerHTML = "";
      const cx = 160;
      const cy = 92;

      if (mode === "dalton") {
        const pulse = 54 + Math.sin(t * 0.04) * 2;
        atomSvg.appendChild(createEl("circle", {
          cx, cy, r: pulse,
          fill: "#8b5cf6",
          stroke: "#ddd6fe",
          "stroke-width": "3"
        }));
        atomSvg.appendChild(createEl("circle", {
          cx: cx - 16, cy: cy - 16, r: 10,
          fill: "rgba(255,255,255,0.22)"
        }));
      } else if (mode === "thomson") {
        atomSvg.appendChild(createEl("circle", {
          cx, cy, r: 58,
          fill: "rgba(244, 63, 94, 0.28)",
          stroke: "#fb7185",
          "stroke-width": "3"
        }));
        const dots = [
          [-26, -18], [22, -24], [0, -6],
          [-28, 16], [18, 22], [32, 2], [-6, 30]
        ];
        dots.forEach(([dx, dy], i) => {
          const jitterX = Math.cos(t * 0.05 + i) * 3;
          const jitterY = Math.sin(t * 0.05 + i) * 3;
          atomSvg.appendChild(createEl("circle", {
            cx: cx + dx + jitterX,
            cy: cy + dy + jitterY,
            r: 7,
            fill: "#38bdf8",
            stroke: "#e0f2fe",
            "stroke-width": "1.5"
          }));
        });
      } else if (mode === "rutherford") {
        const angles = [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2];
        angles.forEach((baseAngle, idx) => {
          const rot = t * 0.035 + baseAngle;
          atomSvg.appendChild(createEl("ellipse", {
            cx, cy, rx: 78, ry: 28,
            fill: "none",
            stroke: "rgba(196, 181, 253, 0.35)",
            "stroke-width": "1.5",
            transform: `rotate(${idx * 45} ${cx} ${cy})`
          }));
          const rad = (idx * 45 * Math.PI) / 180;
          const ex = cx + 78 * Math.cos(rot) * Math.cos(rad) - 28 * Math.sin(rot) * Math.sin(rad);
          const ey = cy + 78 * Math.cos(rot) * Math.sin(rad) + 28 * Math.sin(rot) * Math.cos(rad);
          atomSvg.appendChild(createEl("circle", {
            cx: ex, cy: ey, r: 6,
            fill: "#22d3ee"
          }));
        });
        atomSvg.appendChild(createEl("circle", {
          cx, cy, r: 12,
          fill: "#facc15",
          stroke: "#fef08a",
          "stroke-width": "2"
        }));
      } else if (mode === "bohr") {
        const radii = [32, 54, 76];
        const speeds = [0.05, -0.032, 0.022];
        radii.forEach((r, i) => {
          atomSvg.appendChild(createEl("circle", {
            cx, cy, r,
            fill: "none",
            stroke: "rgba(167, 139, 250, 0.45)",
            "stroke-width": "2",
            "stroke-dasharray": i === 1 ? "5 4" : "none"
          }));
          const a = t * speeds[i] + i;
          const ex = cx + r * Math.cos(a);
          const ey = cy + r * Math.sin(a);
          atomSvg.appendChild(createEl("circle", {
            cx: ex, cy: ey, r: 6.5,
            fill: i === 1 ? "#f43f5e" : "#4ade80"
          }));
        });
        atomSvg.appendChild(createEl("circle", {
          cx, cy, r: 13,
          fill: "#f59e0b"
        }));
      } else if (mode === "schrodinger") {
        for (let i = 0; i < 28; i++) {
          const angle = i * 2.39996 + t * 0.015;
          const dist = 16 + ((i * 19 + Math.sin(t * 0.03 + i) * 14) % 58);
          const px = cx + Math.cos(angle) * dist * 1.35;
          const py = cy + Math.sin(angle) * dist * 0.85;
          const opacity = 0.2 + 0.6 * Math.abs(Math.sin(t * 0.04 + i));
          atomSvg.appendChild(createEl("circle", {
            cx: px, cy: py, r: (i % 3 === 0) ? 5 : 3,
            fill: (i % 2 === 0) ? "#c084fc" : "#38bdf8",
            opacity: opacity.toFixed(2)
           }));
        }
        atomSvg.appendChild(createEl("circle", {
          cx, cy, r: 10,
          fill: "#fde047"
        }));
      }
    }

    function updateScene() {
      const s = scenes[currentIndex];
      modelBadge.textContent = `Modèle : ${s.model}`;
      atomCaption.textContent = s.caption;
      speakerName.textContent = s.speaker;
      speakerName.className = `speaker-name ${s.roleClass}`;
      dialogueText.textContent = s.text;
      stepCounter.textContent = `${currentIndex + 1} / ${scenes.length}`;

      charJax.classList.toggle("speaking", s.activeChar === "char-jax");
      charPomni.classList.toggle("speaking", s.activeChar === "char-pomni");
    }

    function loop() {
      tick += 1;
      renderAtomFrame(scenes[currentIndex].mode, tick);
      animFrame = requestAnimationFrame(loop);
    }

    document.getElementById("next-btn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % scenes.length;
      updateScene();
    });

    document.getElementById("prev-btn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + scenes.length) % scenes.length;
      updateScene();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      currentIndex = 0;
      updateScene();
    });

    const autoBtn = document.getElementById("auto-btn");
    autoBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.textContent = "▶ Auto-lecture";
      } else {
        autoBtn.textContent = "❚❚ Stop auto";
        autoTimer = setInterval(() => {
          currentIndex = (currentIndex + 1) % scenes.length;
          updateScene();
        }, 6500);
      }
    });

    updateScene();
    loop();
  </script>
</body>
</html>
